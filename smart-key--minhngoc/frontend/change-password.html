<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đổi Mật Khẩu Hệ Thống</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 10px; color: #1f2937; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; outline: none; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-submit:hover { background: #2563eb; }
        .btn-back { background: none; border: none; color: #4b5563; cursor: pointer; text-decoration: underline; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Cập Nhật Mật Khẩu</h2>
        <p>Vui lòng nhập đầy đủ thông tin bên dưới để bảo mật tài khoản.</p>
        
        <input type="password" id="old-password" placeholder="Mật khẩu cũ hiện tại">
        <input type="password" id="new-password" placeholder="Mật khẩu mới muốn đổi">
        
        <button class="btn-submit" onclick="changePassword()">Xác Nhận Đổi Mật Khẩu</button>
        <button class="btn-back" onclick="window.location.href='index.html'">Quay lại Dashboard</button>
    </div>

    <script>
        // Bảo mật chặn: Nếu chưa đăng nhập thì không cho vào trang này
        if(!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }

        function changePassword() {
            const username = "admin"; // Đồ án mặc định tài khoản admin
            const oldPass = document.getElementById('old-password').value;
            const newPass = document.getElementById('new-password').value;

            if(!oldPass || !newPass) {
                alert("Vui lòng nhập đầy đủ mật khẩu cũ và mới!");
                return;
            }

            fetch('http://localhost:3000/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: username, 
                    oldPassword: oldPass, 
                    newPassword: newPass 
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert("Mật khẩu đã được đổi thành công! Vui lòng đăng nhập lại.");
                    localStorage.clear(); // Xóa phiên đăng nhập cũ
                    window.location.href = 'login.html'; // Chuyển thẳng về trang login bắt buộc vào lại bằng pass mới
                } else {
                    alert(data.message); // Báo lỗi nếu gõ sai mật khẩu cũ
                }
            })
            .catch(err => alert("Lỗi kết nối Backend Server: " + err));
        }
    </script>
</body>
</html>
